<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${editMode} ? 'Editar proyecto | Portfolio' : 'Nuevo proyecto | Portfolio'">Proyecto | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0" th:text="${editMode} ? 'Editar proyecto' : 'Añadir nuevo proyecto'">Proyecto</h1>
            <a th:href="@{/projects/}" class="btn btn-sm btn-light">
              <i class="bi bi-arrow-left me-1"></i> Volver al listado
            </a>
          </div>
          <div class="card-body">
            <p class="text-muted mb-4"
              th:text="${editMode} ? 'Actualiza los datos del proyecto. Si no seleccionas una nueva imagen, se mantendrá la actual.' : 'Completa los datos del proyecto. La imagen se subirá desde tu equipo y se guardará mediante FileStorageService.'">
              Descripción del formulario
            </p>

            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-start gap-2" role="alert">
              <i class="bi bi-exclamation-triangle-fill mt-1"></i>
              <div th:text="${error}"></div>
            </div>

            <div th:if="${formErrors != null and formErrors and error == null}" class="alert alert-danger d-flex align-items-start gap-2" role="alert">
              <i class="bi bi-exclamation-triangle-fill mt-1"></i>
              <div>Revisa los campos obligatorios. Los mensajes de error aparecen junto a cada campo.</div>
            </div>

            <form th:action="${editMode} ? @{/projects/update/{id}(id=${project.id})} : @{/projects/add}"
              th:object="${project}" method="post" enctype="multipart/form-data" novalidate>
              <input type="hidden" th:field="*{id}">

              <div class="row g-3">
                <div class="col-12">
                  <label for="title" class="form-label">Título del proyecto</label>
                  <input type="text" class="form-control" id="title" placeholder="Ej. Mi Portfolio Personal"
                    th:field="*{title}" th:errorclass="is-invalid" maxlength="255" novalidate>
                  <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="col-12">
                  <label for="description" class="form-label">Descripción</label>
                  <textarea class="form-control" id="description" rows="6"
                    placeholder="Explica qué hace el proyecto, tecnologías usadas, retos y aprendizajes..."
                    th:field="*{description}" th:errorclass="is-invalid" novalidate></textarea>
                  <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>

                <div class="col-md-6">
                  <label for="projectUrl" class="form-label">URL del proyecto</label>
                  <input type="url" class="form-control" id="projectUrl"
                    placeholder="https://github.com/usuario/nombre-repo o https://demo.com" th:field="*{projectUrl}"
                    th:errorclass="is-invalid" maxlength="500" novalidate>
                  <div class="form-text">Opcional. Puedes dejarlo vacío si aún no está publicado.</div>
                  <div class="invalid-feedback" th:errors="*{projectUrl}"></div>
                </div>

                <div class="col-md-6">
                  <label for="personalInfoId" class="form-label">ID de información personal</label>
                  <input type="number" class="form-control" id="personalInfoId" min="1" placeholder="Ej. 1"
                    th:field="*{personalInfoId}" th:errorclass="is-invalid" novalidate>
                  <div class="form-text">Debe coincidir con el ID de <code>personal_info</code> existente.</div>
                  <div class="invalid-feedback" th:errors="*{personalInfoId}"></div>
                </div>

                <div class="col-12">
                  <label for="image" class="form-label">Imagen del proyecto</label>
                  <input class="form-control" type="file" id="image" name="file" accept="image/*" novalidate>
                  <div class="form-text"
                    th:text="${editMode} ? 'Opcional. Selecciona un archivo solo si deseas cambiar la imagen actual.' : 'Formatos aceptados: JPG, PNG, WebP. Obligatorio al crear el proyecto.'">
                  </div>
                </div>

                <div class="col-12" th:if="${editMode and not #strings.isEmpty(project.imageUrl)}">
                  <label class="form-label">Imagen actual</label>
                  <div class="border rounded overflow-hidden" style="max-width: 420px;">
                    <img th:src="${project.imageUrl}" th:alt="|Imagen actual de ${project.title}|"
                      class="img-fluid d-block">
                  </div>
                  <input type="hidden" th:field="*{imageUrl}">
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-check-lg me-1"></i>
                  <span th:text="${editMode} ? 'Guardar cambios' : 'Guardar proyecto'"></span>
                </button>
                <a th:href="@{/projects/}" class="btn btn-outline-secondary">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
