<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <div>
        <h1 class="h3 mb-1">Proyectos</h1>
        <p class="text-muted mb-0">Gestiona los proyectos que se muestran en tu portfolio</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a th:href="@{/projects/new}" class="btn btn-primary">
          <i class="bi bi-plus-lg me-1"></i> Añadir proyecto
        </a>
        <a th:href="@{/}" class="btn btn-outline-secondary">Volver al inicio</a>
      </div>
    </div>

    <div class="row g-4" th:if="${not #lists.isEmpty(projects)}">
      <div class="col-md-6 col-xl-4" th:each="project : ${projects}">
        <article class="card shadow-sm border-0 h-100">
          <div class="ratio ratio-16x9 bg-body-tertiary position-relative">
            <img th:if="${not #strings.isEmpty(project.imageUrl)}" th:src="${project.imageUrl}"
              th:alt="|Vista previa de ${project.title}|" class="object-fit-cover" loading="lazy"
              onerror="this.style.display='none'">
            <div th:if="${#strings.isEmpty(project.imageUrl)}"
              class="d-flex align-items-center justify-content-center text-muted">
              <i class="bi bi-image fs-1"></i>
            </div>
          </div>
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
              <h2 class="h5 card-title mb-0" th:text="${project.title}">Título del proyecto</h2>
              <span class="badge text-bg-secondary">ID: <span th:text="${project.id}"></span></span>
            </div>
            <p class="card-text text-muted small flex-grow-1"
              th:text="${#strings.abbreviate(project.description, 140)}">Descripción...</p>
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
              <div class="d-flex gap-2">
                <a th:href="@{/projects/edit/{id}(id=${project.id})}" class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-pencil me-1"></i> Editar
                </a>
                <form th:action="@{/projects/delete/{id}(id=${project.id})}" method="post"
                  onsubmit="return confirm('¿Seguro que deseas eliminar este proyecto? Esta acción no se puede deshacer.');">
                  <button type="submit" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash me-1"></i> Eliminar
                  </button>
                </form>
              </div>
              <a th:if="${not #strings.isEmpty(project.projectUrl)}" th:href="${project.projectUrl}" target="_blank"
                rel="noopener noreferrer" class="btn btn-sm btn-link text-decoration-none px-0">
                Ver proyecto <i class="bi bi-arrow-up-right"></i>
              </a>
              <span th:if="${#strings.isEmpty(project.projectUrl)}" class="text-muted small">Sin URL</span>
            </div>
          </div>
        </article>
      </div>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(projects)}">
      <i class="bi bi-inbox display-6 text-muted"></i>
      <p class="text-muted mt-2 mb-3">Todavía no hay proyectos añadidos.</p>
      <a th:href="@{/projects/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i> Crear primer proyecto
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
