<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiegoDom - Portfolio | Información personal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0">Información personal</h1>
          </div>
          <div class="card-body">
            <p class="text-muted mb-4">
              Esta es tu carta de presentación: todo lo que escribas aquí es lo primero que verán quienes visiten tu
              portfolio.
            </p>
            <form th:action="@{/personal-info/save}" th:object="${personalInfo}" method="post">
              <input type="hidden" th:field="*{id}">

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="firstName" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="firstName" placeholder="Ej. Diego" th:field="*{firstName}"
                    th:errorclass="is-invalid" maxlength="100" required>
                  <div class="invalid-feedback" th:errors="*{firstName}"></div>
                </div>
                <div class="col-md-6">
                  <label for="lastName" class="form-label">Apellidos</label>
                  <input type="text" class="form-control" id="lastName" placeholder="Ej. Domínguez Ruiz"
                    th:field="*{lastName}" th:errorclass="is-invalid" maxlength="100" required>
                  <div class="invalid-feedback" th:errors="*{lastName}"></div>
                </div>

                <div class="col-12">
                  <label for="title" class="form-label">Título profesional</label>
                  <input type="text" class="form-control" id="title"
                    placeholder="Ej. Desarrollador Backend · Java & Spring Boot" th:field="*{title}"
                    th:errorclass="is-invalid" maxlength="255" required>
                  <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="col-12">
                  <label for="profileDescription" class="form-label">Descripción</label>
                  <textarea class="form-control" id="profileDescription" rows="5"
                    placeholder="Cuenta tu historia en pocas líneas: qué construyes, qué problemas te gusta resolver y qué te mueve a programar."
                    th:field="*{profileDescription}" th:errorclass="is-invalid" required></textarea>
                  <div class="invalid-feedback" th:errors="*{profileDescription}"></div>
                </div>

                <div class="col-md-8">
                  <label for="profileImageUrl" class="form-label">Foto de perfil (URL)</label>
                  <input type="text" class="form-control" id="profileImageUrl"
                    placeholder="https://tu-sitio.com/fotos/yo-sonriendo.jpg" th:field="*{profileImageUrl}"
                    th:errorclass="is-invalid" maxlength="500" aria-describedby="profileImageUrlHelp">
                  <div class="form-text" id="profileImageUrlHelp">
                    Pega el enlace de tu foto favorita. Por ahora la guardamos como texto.
                  </div>
                  <div class="invalid-feedback" th:errors="*{profileImageUrl}"></div>
                </div>
                <div class="col-md-4">
                  <label for="yearsOfExperience" class="form-label">Años de experiencia</label>
                  <input type="number" class="form-control" id="yearsOfExperience" min="0" step="1" placeholder="Ej. 5"
                    th:field="*{yearsOfExperience}" th:errorclass="is-invalid">
                  <div class="invalid-feedback" th:errors="*{yearsOfExperience}"></div>
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" placeholder="Ej. hola@diego.dev"
                    th:field="*{email}" th:errorclass="is-invalid" maxlength="255" required>
                  <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                  <label for="phone" class="form-label">Teléfono</label>
                  <input type="tel" class="form-control" id="phone" placeholder="Ej. +34 600 123 456"
                    th:field="*{phone}" th:errorclass="is-invalid" maxlength="50" required>
                  <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>

                <div class="col-md-6">
                  <label for="linkedinUrl" class="form-label">Perfil de LinkedIn</label>
                  <input type="url" class="form-control" id="linkedinUrl"
                    placeholder="https://www.linkedin.com/in/tu-nombre" th:field="*{linkedinUrl}"
                    th:errorclass="is-invalid" maxlength="500">
                  <div class="invalid-feedback" th:errors="*{linkedinUrl}"></div>
                </div>
                <div class="col-md-6">
                  <label for="githubUrl" class="form-label">Perfil de GitHub</label>
                  <input type="url" class="form-control" id="githubUrl" placeholder="https://github.com/tu-usuario"
                    th:field="*{githubUrl}" th:errorclass="is-invalid" maxlength="500">
                  <div class="invalid-feedback" th:errors="*{githubUrl}"></div>
                </div>
              </div>

              <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Guardar información</button>
                <a href="/" class="btn btn-outline-secondary">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
