<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiegoDom - Portfolio | Error de validación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-danger text-white">
            <h1 class="h4 mb-0">Error de validación</h1>
          </div>
          <div class="card-body">
            <p class="lead mb-3" th:text="${message} ?: 'Se han encontrado errores en los datos enviados.'"></p>
            <div th:if="${errors != null and !errors.isEmpty()}">
              <h2 class="h5">Detalles:</h2>
              <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item" th:each="error : ${errors}">
                  <strong th:if="${error.objectName != null}" th:text="${error.objectName + ': '}"></strong>
                  <span th:text="${error.defaultMessage}"></span>
                  <small class="text-muted d-block" th:if="${error.field != null}"
                    th:text="'Campo: ' + ${error.field}"></small>
                </li>
              </ul>
            </div>
            <div class="d-flex gap-2">
              <a href="/" class="btn btn-primary">Volver al inicio</a>
              <a th:href="@{/admin}" class="btn btn-outline-secondary">Volver al panel</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
