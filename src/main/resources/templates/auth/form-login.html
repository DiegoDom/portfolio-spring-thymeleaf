<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Admin · Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
  <main class="min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <span
                  class="d-inline-flex align-items-center justify-content-center bg-dark text-light rounded-circle p-3 mb-3"
                  aria-hidden="true">
                  <i class="bi bi-shield-lock fs-4"></i>
                </span>
                <h1 class="h4 mb-1">Panel de administración</h1>
                <p class="text-muted small mb-0">Inicia sesión para gestionar tu portfolio.</p>
              </div>

              <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
                <span>Usuario o contraseña incorrectos.</span>
              </div>

              <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                <span>Has cerrado sesión correctamente.</span>
              </div>

              <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                  <label for="username" class="form-label">Usuario</label>
                  <div class="input-group">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username"
                      required autofocus>
                  </div>
                </div>

                <div class="mb-4">
                  <label for="password" class="form-label">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                      autocomplete="current-password" required>
                  </div>
                </div>

                <button type="submit" class="btn btn-dark w-100">
                  <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Iniciar sesión
                </button>
              </form>

              <div class="text-center mt-4">
                <a th:href="@{/}" class="small link-secondary text-decoration-none">
                  <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver al sitio público
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
