<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout :: layout('Proyectos', 'projects', ~{::content})}">

<body>
  <div th:fragment="content">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <div>
        <h1 class="h3 mb-1">Proyectos</h1>
        <p class="text-muted mb-0">Gestiona los proyectos que se muestran en tu portfolio.</p>
      </div>
      <a th:href="@{/admin/projects/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nuevo proyecto
      </a>
    </div>

    <div class="card shadow-sm border-0" th:if="${not #lists.isEmpty(projects)}">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Imagen</th>
              <th scope="col">Proyecto</th>
              <th scope="col">URL</th>
              <th scope="col" class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="project : ${projects}">
              <td class="text-muted" th:text="${project.id}">1</td>
              <td style="width: 90px;">
                <img th:if="${not #strings.isEmpty(project.imageUrl)}"
                  th:src="${#strings.startsWith(project.imageUrl, '/') or #strings.startsWith(project.imageUrl, 'http') ? project.imageUrl : '/' + project.imageUrl}"
                  th:alt="|Imagen de ${project.title}|" class="rounded object-fit-cover" width="64" height="64"
                  loading="lazy" onerror="this.style.display='none'">
                <span th:if="${#strings.isEmpty(project.imageUrl)}"
                  class="d-inline-flex align-items-center justify-content-center bg-body-tertiary text-muted rounded"
                  style="width: 64px; height: 64px;">
                  <i class="bi bi-image" aria-hidden="true"></i>
                </span>
              </td>
              <td>
                <p class="fw-semibold mb-1" th:text="${project.title}">Portfolio Personal</p>
                <p class="text-muted small mb-0" th:text="${#strings.abbreviate(project.description, 120)}">
                  Descripción del proyecto.
                </p>
              </td>
              <td>
                <a th:if="${not #strings.isEmpty(project.projectUrl)}" th:href="${project.projectUrl}" target="_blank"
                  rel="noopener noreferrer" class="link-primary text-decoration-none">
                  Ver proyecto <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
                </a>
                <span th:if="${#strings.isEmpty(project.projectUrl)}" class="text-muted small">Sin URL</span>
              </td>
              <td class="text-end">
                <div class="d-inline-flex gap-2">
                  <a th:href="@{/admin/projects/{id}/edit(id=${project.id})}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil me-1" aria-hidden="true"></i>Editar
                  </a>
                  <form th:action="@{/admin/projects/{id}/delete(id=${project.id})}" method="post"
                    onsubmit="return confirm('¿Seguro que deseas eliminar este proyecto? Esta acción no se puede deshacer.');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      <i class="bi bi-trash me-1" aria-hidden="true"></i>Eliminar
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(projects)}">
      <i class="bi bi-inbox display-6 text-muted" aria-hidden="true"></i>
      <p class="text-muted mt-2 mb-3">Todavía no hay proyectos registrados.</p>
      <a th:href="@{/admin/projects/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Crear el primer proyecto
      </a>
    </div>
  </div>
</body>

</html>
