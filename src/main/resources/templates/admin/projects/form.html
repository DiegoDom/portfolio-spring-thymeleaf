<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout :: layout(${editMode ? 'Editar proyecto' : 'Nuevo proyecto'}, 'projects', ~{::content})}">

<body>
  <div th:fragment="content">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <div>
        <h1 class="h3 mb-1" th:text="${editMode} ? 'Editar proyecto' : 'Nuevo proyecto'">Proyecto</h1>
        <p class="text-muted mb-0"
          th:text="${editMode} ? 'Actualiza los datos del proyecto. Si no seleccionas una nueva imagen, se mantendrá la actual.' : 'Añade un proyecto a tu portfolio.'">
          Datos del proyecto
        </p>
      </div>
      <a th:href="@{/admin/projects}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver al listado
      </a>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div th:if="${formErrors != null and formErrors}" class="alert alert-danger d-flex align-items-start gap-2"
              role="alert">
              <i class="bi bi-exclamation-triangle-fill mt-1" aria-hidden="true"></i>
              <div>Revisa los campos obligatorios. Los mensajes de error aparecen junto a cada campo.</div>
            </div>

            <form th:action="${editMode} ? @{/admin/projects/{id}(id=${project.id})} : @{/admin/projects}"
              th:object="${project}" method="post" enctype="multipart/form-data" novalidate>
              <input type="hidden" th:field="*{id}">
              <input type="hidden" th:field="*{personalInfoId}">

              <div class="row g-3">
                <div class="col-12">
                  <label for="title" class="form-label">Título del proyecto</label>
                  <input type="text" class="form-control" id="title" placeholder="Ej. Mi Portfolio Personal"
                    th:field="*{title}" th:errorclass="is-invalid" maxlength="255">
                  <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="col-12">
                  <label for="description" class="form-label">Descripción</label>
                  <textarea class="form-control" id="description" rows="6"
                    placeholder="Explica qué hace el proyecto, tecnologías usadas, retos y aprendizajes..."
                    th:field="*{description}" th:errorclass="is-invalid"></textarea>
                  <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>

                <div class="col-12">
                  <label for="projectUrl" class="form-label">URL del proyecto</label>
                  <input type="url" class="form-control" id="projectUrl"
                    placeholder="https://github.com/usuario/nombre-repo o https://demo.com" th:field="*{projectUrl}"
                    th:errorclass="is-invalid" maxlength="500">
                  <div class="form-text">Opcional. Puedes dejarlo vacío si aún no está publicado.</div>
                  <div class="invalid-feedback" th:errors="*{projectUrl}"></div>
                </div>

                <div class="col-12">
                  <label for="image" class="form-label">Imagen del proyecto</label>
                  <input class="form-control" type="file" id="image" name="file" accept="image/*">
                  <div class="form-text"
                    th:text="${editMode} ? 'Opcional. Selecciona un archivo solo si deseas cambiar la imagen actual.' : 'Opcional. Si no seleccionas una imagen, se mostrará un marcador de posición.'">
                  </div>
                </div>

                <div class="col-12" th:if="${editMode and not #strings.isEmpty(project.imageUrl)}">
                  <label class="form-label">Imagen actual</label>
                  <div class="border rounded overflow-hidden" style="max-width: 420px;">
                    <img
                      th:src="${#strings.startsWith(project.imageUrl, '/') or #strings.startsWith(project.imageUrl, 'http') ? project.imageUrl : '/' + project.imageUrl}"
                      th:alt="|Imagen actual de ${project.title}|" class="img-fluid d-block">
                  </div>
                  <input type="hidden" th:field="*{imageUrl}">
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-check-lg me-1" aria-hidden="true"></i>
                  <span th:text="${editMode} ? 'Guardar cambios' : 'Crear proyecto'">Guardar</span>
                </button>
                <a th:href="@{/admin/projects}" class="btn btn-outline-secondary">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
