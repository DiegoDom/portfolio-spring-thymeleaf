<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout :: layout('Formación', 'educations', ~{::content})}">

<body>
  <div th:fragment="content">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <div>
        <h1 class="h3 mb-1">Formación</h1>
        <p class="text-muted mb-0">Gestiona los estudios y cursos que se muestran en tu portfolio.</p>
      </div>
      <a th:href="@{/admin/educations/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nueva formación
      </a>
    </div>

    <div class="card shadow-sm border-0" th:if="${not #lists.isEmpty(educations)}">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Título</th>
              <th scope="col">Institución</th>
              <th scope="col">Periodo</th>
              <th scope="col" class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="education : ${educations}">
              <td class="text-muted" th:text="${education.id}">1</td>
              <td class="fw-semibold" th:text="${education.degree}">Ingeniería en Sistemas</td>
              <td th:text="${education.institution}">Universidad XYZ</td>
              <td class="text-nowrap">
                <span th:text="${education.startDate}">2015-03-01</span>
                <span class="text-muted mx-1">→</span>
                <span th:text="${education.endDate != null ? education.endDate : 'Actualidad'}">2020-12-15</span>
              </td>
              <td class="text-end">
                <div class="d-inline-flex gap-2">
                  <a th:href="@{/admin/educations/{id}/edit(id=${education.id})}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil me-1" aria-hidden="true"></i>Editar
                  </a>
                  <form th:action="@{/admin/educations/{id}/delete(id=${education.id})}" method="post"
                    onsubmit="return confirm('¿Seguro que deseas eliminar esta formación? Esta acción no se puede deshacer.');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      <i class="bi bi-trash me-1" aria-hidden="true"></i>Eliminar
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="text-center py-5" th:if="${#lists.isEmpty(educations)}">
      <i class="bi bi-inbox display-6 text-muted" aria-hidden="true"></i>
      <p class="text-muted mt-2 mb-3">Todavía no hay formación registrada.</p>
      <a th:href="@{/admin/educations/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Crear la primera formación
      </a>
    </div>
  </div>
</body>

</html>
