<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, active, content)">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' | Admin · Portfolio'">Admin | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/admin}">
        <i class="bi bi-speedometer2" aria-hidden="true"></i>
        <span>Panel de administración</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar"
        aria-controls="adminNavbar" aria-expanded="false" aria-label="Abrir menú de administración">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="adminNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/admin}">
              <i class="bi bi-grid me-1" aria-hidden="true"></i>Inicio
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'profile'} ? 'active'" th:href="@{/admin/personal-info}">
              <i class="bi bi-person me-1" aria-hidden="true"></i>Perfil
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'skills'} ? 'active'" th:href="@{/admin/skills}">
              <i class="bi bi-lightning-charge me-1" aria-hidden="true"></i>Habilidades
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'educations'} ? 'active'" th:href="@{/admin/educations}">
              <i class="bi bi-mortarboard me-1" aria-hidden="true"></i>Formación
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'experiences'} ? 'active'" th:href="@{/admin/experiences}">
              <i class="bi bi-briefcase me-1" aria-hidden="true"></i>Experiencia
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'projects'} ? 'active'" th:href="@{/admin/projects}">
              <i class="bi bi-folder2-open me-1" aria-hidden="true"></i>Proyectos
            </a>
          </li>
        </ul>

        <a class="btn btn-outline-light btn-sm" th:href="@{/}" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-box-arrow-up-right me-1" aria-hidden="true"></i>Ver sitio público
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div th:if="${success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle-fill me-2" aria-hidden="true"></i>
      <span th:text="${success}">Operación completada.</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
      <span th:text="${error}">Se ha producido un error.</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div th:replace="${content}"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
