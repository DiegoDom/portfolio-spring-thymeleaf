<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout :: layout(${editMode ? 'Editar experiencia' : 'Nueva experiencia'}, 'experiences', ~{::content})}">

<body>
  <div th:fragment="content">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <div>
        <h1 class="h3 mb-1" th:text="${editMode} ? 'Editar experiencia' : 'Nueva experiencia'">Experiencia</h1>
        <p class="text-muted mb-0"
          th:text="${editMode} ? 'Actualiza los datos de la experiencia seleccionada.' : 'Añade un puesto de trabajo a tu portfolio.'">
          Datos de la experiencia
        </p>
      </div>
      <a th:href="@{/admin/experiences}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver al listado
      </a>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div th:if="${formErrors != null and formErrors}" class="alert alert-danger d-flex align-items-start gap-2"
              role="alert">
              <i class="bi bi-exclamation-triangle-fill mt-1" aria-hidden="true"></i>
              <div>Revisa los campos obligatorios. Los mensajes de error aparecen junto a cada campo.</div>
            </div>

            <form th:action="${editMode} ? @{/admin/experiences/{id}(id=${experience.id})} : @{/admin/experiences}"
              th:object="${experience}" method="post" novalidate>
              <input type="hidden" th:field="*{id}">
              <input type="hidden" th:field="*{personalInfoId}">

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="jobTitle" class="form-label">Puesto</label>
                  <input type="text" class="form-control" id="jobTitle"
                    placeholder="Ej. Desarrollador Full Stack Senior" th:field="*{jobTitle}"
                    th:errorclass="is-invalid" maxlength="255">
                  <div class="invalid-feedback" th:errors="*{jobTitle}"></div>
                </div>

                <div class="col-md-6">
                  <label for="companyName" class="form-label">Empresa</label>
                  <input type="text" class="form-control" id="companyName" placeholder="Ej. Tech Solutions S.A."
                    th:field="*{companyName}" th:errorclass="is-invalid" maxlength="255">
                  <div class="invalid-feedback" th:errors="*{companyName}"></div>
                </div>

                <div class="col-md-6">
                  <label for="startDate" class="form-label">Fecha de inicio</label>
                  <input type="date" class="form-control" id="startDate"
                    th:field="*{startDate}" th:errorclass="is-invalid">
                  <div class="invalid-feedback" th:errors="*{startDate}"></div>
                </div>

                <div class="col-md-6">
                  <label for="endDate" class="form-label">Fecha de fin</label>
                  <input type="date" class="form-control" id="endDate"
                    th:field="*{endDate}" th:errorclass="is-invalid">
                  <div class="form-text">Déjala vacía si sigues trabajando en este puesto.</div>
                  <div class="invalid-feedback" th:errors="*{endDate}"></div>
                </div>

                <div class="col-12">
                  <label for="description" class="form-label">Descripción</label>
                  <textarea class="form-control" id="description" rows="4"
                    placeholder="Describe tus responsabilidades, tecnologías y logros."
                    th:field="*{description}" th:errorclass="is-invalid"></textarea>
                  <div class="form-text">Opcional.</div>
                  <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-check-lg me-1" aria-hidden="true"></i>
                  <span th:text="${editMode} ? 'Guardar cambios' : 'Crear experiencia'">Guardar</span>
                </button>
                <a th:href="@{/admin/experiences}" class="btn btn-outline-secondary">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
