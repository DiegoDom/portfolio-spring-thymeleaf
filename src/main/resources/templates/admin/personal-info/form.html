<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{admin/layout :: layout('Perfil', 'profile', ~{::content})}">

<body>
  <div th:fragment="content">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
      <div>
        <h1 class="h3 mb-1">Información personal</h1>
        <p class="text-muted mb-0">Esta es la carta de presentación que verán los visitantes de tu portfolio.</p>
      </div>
      <a th:href="@{/admin}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Volver al panel
      </a>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div th:if="${formErrors != null and formErrors}" class="alert alert-danger d-flex align-items-start gap-2"
              role="alert">
              <i class="bi bi-exclamation-triangle-fill mt-1" aria-hidden="true"></i>
              <div>Revisa los campos obligatorios. Los mensajes de error aparecen junto a cada campo.</div>
            </div>

            <form th:action="@{/admin/personal-info}" th:object="${personalInfo}" method="post" novalidate>
              <input type="hidden" th:field="*{id}">

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="firstName" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="firstName" placeholder="Ej. Diego"
                    th:field="*{firstName}" th:errorclass="is-invalid" maxlength="100">
                  <div class="invalid-feedback" th:errors="*{firstName}"></div>
                </div>

                <div class="col-md-6">
                  <label for="lastName" class="form-label">Apellidos</label>
                  <input type="text" class="form-control" id="lastName" placeholder="Ej. Domínguez Ruiz"
                    th:field="*{lastName}" th:errorclass="is-invalid" maxlength="100">
                  <div class="invalid-feedback" th:errors="*{lastName}"></div>
                </div>

                <div class="col-12">
                  <label for="title" class="form-label">Título profesional</label>
                  <input type="text" class="form-control" id="title"
                    placeholder="Ej. Desarrollador Backend Java & Spring Boot" th:field="*{title}"
                    th:errorclass="is-invalid" maxlength="255">
                  <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="col-12">
                  <label for="profileDescription" class="form-label">Descripción</label>
                  <textarea class="form-control" id="profileDescription" rows="5"
                    placeholder="Cuenta tu historia en pocas líneas: qué construyes, qué problemas te gusta resolver y qué te mueve a programar."
                    th:field="*{profileDescription}" th:errorclass="is-invalid"></textarea>
                  <div class="invalid-feedback" th:errors="*{profileDescription}"></div>
                </div>

                <div class="col-md-8">
                  <label for="profileImageUrl" class="form-label">Foto de perfil (URL)</label>
                  <input type="text" class="form-control" id="profileImageUrl"
                    placeholder="Ej. /img/mi-foto.jpg o https://tu-sitio.com/fotos/yo.jpg"
                    th:field="*{profileImageUrl}" th:errorclass="is-invalid" maxlength="500"
                    aria-describedby="profileImageUrlHelp">
                  <div class="form-text" id="profileImageUrlHelp">
                    Puedes usar una ruta local (por ejemplo, /img/mi-foto.jpg) o una URL completa.
                  </div>
                  <div class="invalid-feedback" th:errors="*{profileImageUrl}"></div>
                </div>

                <div class="col-md-4">
                  <label for="yearsOfExperience" class="form-label">Años de experiencia</label>
                  <input type="number" class="form-control" id="yearsOfExperience" min="0" step="1"
                    placeholder="Ej. 5" th:field="*{yearsOfExperience}" th:errorclass="is-invalid">
                  <div class="invalid-feedback" th:errors="*{yearsOfExperience}"></div>
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" placeholder="Ej. hola@diego.dev"
                    th:field="*{email}" th:errorclass="is-invalid" maxlength="255">
                  <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                  <label for="phone" class="form-label">Teléfono</label>
                  <input type="tel" class="form-control" id="phone" placeholder="Ej. +34 600 123 456"
                    th:field="*{phone}" th:errorclass="is-invalid" maxlength="50">
                  <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>

                <div class="col-md-6">
                  <label for="linkedinUrl" class="form-label">Perfil de LinkedIn</label>
                  <input type="url" class="form-control" id="linkedinUrl"
                    placeholder="https://www.linkedin.com/in/tu-nombre" th:field="*{linkedinUrl}"
                    th:errorclass="is-invalid" maxlength="500">
                  <div class="invalid-feedback" th:errors="*{linkedinUrl}"></div>
                </div>

                <div class="col-md-6">
                  <label for="githubUrl" class="form-label">Perfil de GitHub</label>
                  <input type="url" class="form-control" id="githubUrl" placeholder="https://github.com/tu-usuario"
                    th:field="*{githubUrl}" th:errorclass="is-invalid" maxlength="500">
                  <div class="invalid-feedback" th:errors="*{githubUrl}"></div>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Guardar información
                </button>
                <a th:href="@{/admin}" class="btn btn-outline-secondary">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
